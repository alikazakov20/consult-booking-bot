services:
  - type: web
    name: consult-booking-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run prisma:generate --workspace server && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: BOT_MODE
        value: webhook
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: REMINDER_HOURS_BEFORE
        value: "3"
      - key: NODE_VERSION
        value: "20"
